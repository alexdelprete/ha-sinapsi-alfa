name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          # phcc 0.13.357+ targets HA 2026.9 beta (calls runner.configure_event_loop,
          # absent in stable 2026.8.x, which requirements-dev.txt resolves to) —
          # every test errors at setup. Keep pinned to the last stable-HA release
          # until HA 2026.9 is stable, then bump both together (template + pyproject).
          uv pip install pytest-homeassistant-custom-component==0.13.356 --system
          uv pip install -r requirements-dev.txt --system
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=custom_components/sinapsi_alfa \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy \
            -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: coverage
          verbose: true

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v7
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          verbose: true
