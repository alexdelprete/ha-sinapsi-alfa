version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "homeassistant"
      # ruff and ty are pinned fleet-wide by TOOL_VERSIONS in the template repo
      # (CI, pre-commit hooks, and these pyproject entries are all rendered from
      # it); a Dependabot bump here would fight the sync. Bump the table instead.
      - dependency-name: "ruff"
      - dependency-name: "ty"
